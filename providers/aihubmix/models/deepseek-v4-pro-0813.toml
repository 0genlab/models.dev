# Toggle:
# $.enable_thinking = true|false on the OpenAI-compatible /v1/chat/completions path (verified live 2026-09-11);
# $.thinking.type = "enabled"|"disabled"|"adaptive" on /v1/messages; $.generationConfig.thinkingConfig on the Gemini path.
# Effort: low|high|max
# $.reasoning_effort on /v1/chat/completions (alias $.reasoning.effort, which is also the Responses field);
# $.output_config.effort on /v1/messages, subject to model support.
# https://docs.aihubmix.com/cn/api/unified-inference
# The host narrows the levels per model — this set is shared by all seven DeepSeek
# routes — but `low` is not observably distinct here: probed 2026-09-15, low/high/max
# return 522/564/510 reasoning tokens on one prompt, non-monotonic across levels, and
# the lab's own docs give `reasoning_effort = high|max` with low/medium aliased to high.
# `none` turns thinking off here yet is absent from the published set. Both gaps are
# the host's to state; this file follows what it publishes.
base_model = "deepseek/deepseek-v4-pro-0813"

[interleaved]
field = "reasoning_content"

[[reasoning_options]]
type = "toggle"

[[reasoning_options]]
type = "effort"
values = ["low", "high", "max"]

[cost]
input = 0.6918
output = 2.0754
cache_read = 0.023058
